<title>JC Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* =====================================================================
   HOW TO ADD A NEW SUBJECT
   1. Upload the new app to the same GitHub repository, e.g. irish.html
   2. Scroll down to SUBJECTS (in the <script> near the bottom)
   3. Copy one of the { ... } blocks, paste it below, and change:
        name   – what shows on the tile
        file   – the file name you uploaded
        blurb  – one short line
        bg/fg  – tile colour and text colour
        key    – leave as "" for a new subject
   4. Commit. The new tile appears on his phone next time he opens it.
   ===================================================================== */
:root{--paper:#FAF8F1;--ink:#15171C;--muted:#5A5F6E;--card:#FFFFFF;--edge:#15171C;--grid:rgba(38,67,217,.07);
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root{--paper:#13171F;--ink:#EEF0F4;--muted:#A0A7B6;--card:#1D2330;--edge:#05070B;--grid:rgba(255,255,255,.04);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:22px}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1;letter-spacing:-.03em;margin:0}
header h1 b{display:inline-block;background:#FFD43B;color:#15171C;padding:0 10px;border-radius:8px;transform:rotate(-2deg)}
header p{margin:10px 0 0;color:var(--muted);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;min-height:170px;padding:20px;border-radius:22px;border:2px solid var(--edge);box-shadow:5px 5px 0 var(--edge);text-decoration:none;background:var(--bg);color:var(--fg);transition:transform .12s}
.tile:hover{transform:translate(-2px,-2px)}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--edge)}
.tile:focus-visible{outline:3px solid #2643D9;outline-offset:3px}
.tile .tag{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.tile h2{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;margin:0;letter-spacing:-.02em}
.tile p{margin:0;font-size:16px;opacity:.9;max-width:30ch}
.tile .stats{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.tile .stats span{background:rgba(255,255,255,.85);color:#15171C;border:2px solid #15171C;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.tile .go{position:absolute;right:18px;top:18px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);color:#15171C;border:2px solid #15171C;display:grid;place-items:center}
.tile.soon{background:transparent;color:var(--muted);border-style:dashed;box-shadow:none;justify-content:center;align-items:center;text-align:center;min-height:120px}
.tile.soon h2{font-size:22px}
footer{color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>JC <b>Study</b></h1>
    <p id="hello">Pick a subject.</p>
  </header>
  <div class="grid" id="grid"></div>
  <footer>Progress is saved on this phone.</footer>
</div>
<script>
/* ---------- SUBJECTS: edit this list to add more ---------- */
const SUBJECTS=[
  {name:"Maths",  tag:"Higher Level", file:"maths.html",  blurb:"Bite-size scroll, topic quest and exam papers.", bg:"#FFD43B", fg:"#15171C", key:"jcmq.v1"},
  {name:"French", tag:"Français",     file:"french.html", blurb:"Words, sentences, grammar, listening and writing.", bg:"#1D2B6B", fg:"#FFFFFF", key:"jcfr.v1"},
  // Example for later (remove the two slashes at the start to switch it on):
  // {name:"Irish", tag:"Gaeilge", file:"irish.html", blurb:"Your next subject.", bg:"#169A5A", fg:"#FFFFFF", key:""},
];
/* ---------------------------------------------------------- */
const h=new Date().getHours();
document.getElementById('hello').textContent=(h<12?'Good morning.':h<18?'Good afternoon.':'Good evening.')+' Pick a subject.';
const grid=document.getElementById('grid');
const today=new Date().toISOString().slice(0,10),yday=new Date(Date.now()-864e5).toISOString().slice(0,10);
function stats(key){if(!key)return '';try{const s=JSON.parse(localStorage.getItem(key)||'null');if(!s)return '<span>Not started yet</span>';
  const streak=(s.last===today||s.last===yday)?s.streak:0;return `<span>${s.xp||0} XP</span><span>${streak} day streak</span>`}catch(e){return ''}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
SUBJECTS.forEach(s=>{const a=document.createElement('a');a.className='tile';a.href=s.file;a.style.setProperty('--bg',s.bg);a.style.setProperty('--fg',s.fg);
  a.innerHTML=`<span class="tag">${esc(s.tag||'')}</span><h2>${esc(s.name)}</h2><p>${esc(s.blurb||'')}</p><div class="stats">${stats(s.key)}</div><span class="go" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>`;
  grid.appendChild(a)});
const soon=document.createElement('div');soon.className='tile soon';soon.innerHTML='<h2>More subjects coming</h2>';grid.appendChild(soon);
</script>
</body>
</html>
