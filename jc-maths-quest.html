<body>
<title>JC Maths Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: phone-first app shell. Header / one of three views / bottom tab bar. Copybook paper by day, chalkboard by night. */
:root{
  --paper:#FAF8F1; --grid:rgba(38,67,217,.075); --ink:#15171C; --muted:#5A5F6E; --stroke:#15171C; --edge:#15171C;
  --card:#FFFFFF; --soft:#EEF1FD; --rule:rgba(38,67,217,.14);
  --biro:#2643D9; --on-biro:#FFFFFF; --marker:#FFD43B; --on-marker:#15171C;
  --redpen:#D93030; --mint:#0F9A64; --on-mint:#FFFFFF; --coral:#FF8A65; --on-coral:#15171C;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13201A; --grid:rgba(255,255,255,.045); --ink:#ECEFE6; --muted:#9EA99B; --stroke:#3C4E45; --edge:#070C0A;
  --card:#1B2923; --soft:#22342C; --rule:rgba(255,255,255,.08);
  --biro:#8EA2FF; --on-biro:#0D1230; --marker:#FFD43B; --on-marker:#15171C;
  --redpen:#FF7070; --mint:#3CD596; --on-mint:#0B2219; --coral:#FF9C7D; --on-coral:#15171C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13201A; --grid:rgba(255,255,255,.045); --ink:#ECEFE6; --muted:#9EA99B; --stroke:#3C4E45; --edge:#070C0A;
  --card:#1B2923; --soft:#22342C; --rule:rgba(255,255,255,.08);
  --biro:#8EA2FF; --on-biro:#0D1230; --marker:#FFD43B; --on-marker:#15171C;
  --redpen:#FF7070; --mint:#3CD596; --on-mint:#0B2219; --coral:#FF9C7D; --on-coral:#15171C; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--biro);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.03em;white-space:nowrap}
.brand b{display:inline-block;background:var(--marker);color:var(--on-marker);padding:0 7px;border-radius:5px;transform:rotate(-2.5deg);margin-left:2px}
.stats{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--stroke);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;background:var(--card);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:4px 16px 28px}
nav.tabs{display:flex;justify-content:center;gap:6px;padding:8px 12px;border-top:2px solid var(--stroke);background:var(--card)}
nav.tabs button{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 4px;border-radius:12px;font-weight:700;font-size:13px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--marker);color:var(--on-marker)}

/* ---------- Scroll feed ---------- */
#v-feed{padding:0;overflow:hidden}
.reels{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;padding:10px 16px}
.rc{position:relative;width:100%;max-width:460px;height:100%;border-radius:24px;border:2px solid var(--stroke);box-shadow:5px 5px 0 var(--edge);
  padding:56px 76px 30px 24px;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow:hidden}
.rc.c0{background:var(--marker);color:var(--on-marker)}
.rc.c1{background:var(--biro);color:var(--on-biro)}
.rc.c2{background:var(--mint);color:var(--on-mint)}
.rc.c3{background:var(--coral);color:var(--on-coral)}
.rc .tag{position:absolute;top:18px;left:22px;font-weight:700;font-size:14px;opacity:.85}
.rc .count{position:absolute;top:18px;right:22px;font-size:13px;font-weight:700;opacity:.7;font-variant-numeric:tabular-nums}
.rc h2{font-size:clamp(28px,7.5vw,40px)}
.rc p{margin:0;font-size:18px;max-width:30ch}
.rc .fx{font-size:22px;font-weight:700;background:rgba(255,255,255,.22);border:2px dashed currentColor;border-radius:12px;padding:10px 14px;align-self:flex-start;max-width:100%}
.rc.c0 .fx,.rc.c3 .fx{background:rgba(255,255,255,.4)}
.rc .check{margin-top:4px;border:2px solid currentColor;border-radius:14px;padding:10px 14px;background:transparent;text-align:left;font-weight:700;font-size:16px}
.rc .check .ans{display:block;font-family:var(--f-hand);font-size:28px;line-height:1.1;margin-top:4px}
.rail{position:absolute;right:12px;bottom:26px;display:flex;flex-direction:column;gap:16px;align-items:center}
.rail button{width:50px;height:50px;border-radius:50%;border:2px solid currentColor;background:rgba(255,255,255,.18);display:grid;place-items:center;color:inherit}
.rail button svg{width:24px;height:24px}
.rail small{display:block;text-align:center;font-size:11px;font-weight:700;margin-top:3px}
.rail button[aria-pressed="true"]{background:var(--redpen);color:#fff;border-color:var(--redpen)}
.hint{font-size:14px;font-weight:700;opacity:.8;display:flex;align-items:center;gap:6px}
.hint svg{width:18px;height:18px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* ---------- Quest ---------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
.sec-head h1{font-size:clamp(28px,6vw,40px)}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:56ch}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--card);border:2px solid var(--stroke);border-radius:18px;box-shadow:4px 4px 0 var(--edge);padding:16px;transition:transform .12s}
.tcard:hover{transform:translate(-2px,-2px)}
.tcard .strand{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tcard h3{font-size:21px}
.tcard .blurb{font-size:14px;color:var(--muted);margin:0}
.bar{height:10px;border-radius:99px;background:var(--soft);border:2px solid var(--stroke);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint)}
.tmeta{display:flex;justify-content:space-between;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.trophy{color:var(--marker)}
.back{border:2px solid var(--stroke);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.map{position:relative;max-width:420px;margin:10px auto 0;display:flex;flex-direction:column;gap:26px;padding-bottom:30px}
.node{display:flex;align-items:center;gap:14px}
.node:nth-child(4n+2){margin-left:22%}
.node:nth-child(4n+3){margin-left:40%}
.node:nth-child(4n){margin-left:18%}
.nbtn{flex:none;width:76px;height:76px;border-radius:50%;border:3px solid var(--stroke);background:var(--card);box-shadow:0 6px 0 var(--edge);font-family:var(--f-display);font-weight:800;font-size:28px;display:grid;place-items:center}
.nbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.nbtn.open{background:var(--biro);color:var(--on-biro)}
.nbtn.done{background:var(--mint);color:var(--on-mint)}
.nbtn.boss{border-radius:22px;background:var(--redpen);color:#fff}
.nbtn.boss.done{background:var(--marker);color:var(--on-marker)}
.nbtn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:0 6px 0 var(--edge)}
.nbtn svg{width:30px;height:30px}
.nlabel{display:flex;flex-direction:column;min-width:0}
.nlabel b{font-family:var(--f-display);font-size:18px}
.nlabel span{font-size:13px;color:var(--muted)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:16px;height:16px}
.stars .on{color:var(--marker)} .stars .off{color:var(--stroke);opacity:.6}

/* ---------- Game overlay ---------- */
.game{position:absolute;inset:0;z-index:5;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;display:flex;flex-direction:column;overflow-y:auto}
.game-in{width:100%;max-width:640px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:16px;flex:1}
.gbar{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:50%;border:2px solid var(--stroke);background:var(--card);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.gbar .bar{flex:1;height:16px}
.hearts{display:flex;gap:3px;color:var(--redpen)} .hearts svg{width:22px;height:22px} .hearts .lost{opacity:.2}
.qcard{background:var(--card);border:2px solid var(--stroke);border-radius:20px;box-shadow:4px 4px 0 var(--edge);padding:20px}
.qcard .lvl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

<script>
// ---------- helpers ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const M=n=>n<0?'−'+Math.abs(n):''+n;
const pb=n=>n<0?'('+M(n)+')':''+n;
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','−':'⁻'};
const sup=s=>String(s).split('').map(c=>SUP[c]||c).join('');
const frac=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?M(n):M(n)+'/'+d};
const eur=n=>(n<0?'-':'')+'€'+Math.abs(n).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
function poly(cs,vars){let s='';cs.forEach((c,i)=>{if(!c)return;const v=vars[i],a=Math.abs(c),k=(a===1&&v)?'':a;
  s+= s?(c<0?' − ':' + ')+k+v : (c<0?'−':'')+k+v});return s||'0'}
const P2=(a,b,c,x='x')=>poly([a,b,c],[x+'²',x,'']);
const br=(a,b)=>'('+poly([a,b],['x',''])+')';
const F=(t,d)=>`<span class="fr"><span>${t}</span><span>${d}</span></span>`;
function mk(q,a,wrongs,why,extra,vis){const seen=new Set([String(a)]),w=[];
  for(const x of wrongs){if(x==null)continue;const s=String(x);if(/^-|€-|NaN|Infinity|undefined/.test(s)||seen.has(s))continue;seen.add(s);w.push(s);if(w.length===3)break}
  for(const f of ['None of these','Cannot be found'])if(w.length<3)w.push(f);
  return {q:q+(extra?'<div class="qfig">'+extra+'</div>':''),a:String(a),opts:shuffle([String(a),...w]),why,vis}}
const TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]];
function tri(o,a,h){return `<svg class="tri" viewBox="0 0 260 170" role="img" aria-label="Right-angled triangle"><path d="M20 140H220V30Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M206 140v-14h14" fill="none" stroke="currentColor" stroke-width="2"/><path d="M58 140a38 38 0 0 0-5-19" fill="none" stroke="var(--redpen)" stroke-width="3"/><text x="64" y="132" fill="var(--redpen)" font-weight="700" font-size="16">A</text><text x="120" y="162" text-anchor="middle" fill="currentColor" font-size="15">adj = ${a}</text><text x="228" y="90" fill="currentColor" font-size="15">${o}</text><text x="96" y="74" text-anchor="end" fill="currentColor" font-size="15">hyp = ${h}</text></svg>`}

// ---------- Quest topics: 4 levels each, Basic → Expert ----------
const LV=['Warm-up','Building','Higher','Expert'];
const TOPICS=[
{id:'num',name:'Number & Indices',strand:'Number',blurb:'BIMDAS, index laws, fractional powers, scientific notation.',levels:[
 {tip:'Order of operations is BIMDAS: Brackets, Indices, Multiply and Divide (left to right), then Add and Subtract (left to right).',gen:()=>{const a=R(2,9),b=R(2,9),c=R(2,6),d=R(1,9);
  if(Math.random()<.5){const s=a+b*c-d;return mk(`Work out <b>${a} + ${b} × ${c} − ${d}</b>`,M(s),[(a+b)*c-d,a+b*(c-d),a*b+c-d,s+2,s-1,s+3].map(M),`Multiply first: ${b} × ${c} = ${b*c}. Then ${a} + ${b*c} − ${d} = ${s}.`)}
  const s=a*a-b*c;return mk(`Work out <b>${a}² − ${b} × ${c}</b>`,M(s),[2*a-b*c,(a*a-b)*c,a*a+b*c,s+1,s-2].map(M),`Index first: ${a}² = ${a*a}. Then ${b} × ${c} = ${b*c}. ${a*a} − ${b*c} = ${M(s)}.`)}},
 {tip:'Index laws only work when the bases match. Multiply → add the powers. Divide → subtract. Power of a power → multiply.',gen:()=>{const v=pick(['x','a','y','k']),t=R(0,2);let m=R(2,7),n=R(2,6),q,e,why;
  if(t===0){q=`${v}${sup(m)} × ${v}${sup(n)}`;e=m+n;why=`Multiplying: add the powers. ${m} + ${n} = ${e}.`}
  else if(t===1){m=n+R(1,5);q=`${v}${sup(m)} ÷ ${v}${sup(n)}`;e=m-n;why=`Dividing: subtract the powers. ${m} − ${n} = ${e}.`}
  else{q=`(${v}${sup(m)})${sup(n)}`;e=m*n;why=`Power of a power: multiply. ${m} × ${n} = ${e}.`}
  return mk(`Simplify <b>${q}</b>`,v+sup(e),[m+n,m-n,m*n,e+1,e-1,e+2,2*e].filter(x=>x>0&&x!==e).map(x=>v+sup(x)),why,'',t<2?FIG.idx(v,m,n,t):FIG.idx(v,m,n,2))}},
 {tip:'For a fractional power like 8<sup>2/3</sup>: the bottom is the root, the top is the power. Root first to keep numbers small. A negative power means "one over".',gen:()=>{const T=[['8','2/3','4',['16/3','6','2','1/4'],'Cube root of 8 is 2, then 2² = 4.'],['27','2/3','9',['18','3','6','1/9'],'Cube root of 27 is 3, then 3² = 9.'],['16','3/4','8',['12','2','4','1/8'],'Fourth root of 16 is 2, then 2³ = 8.'],['25','3/2','125',['37.5','5','15','1/125'],'Square root of 25 is 5, then 5³ = 125.'],['4','−2','1/16',['−16','−8','16','1/8'],'Negative power means flip: 4⁻² = 1/4² = 1/16.'],['32','2/5','4',['12.8','2','8','1/4'],'Fifth root of 32 is 2, then 2² = 4.'],['64','−1/2','1/8',['−8','8','−32','1/32'],'Flip, then square root: 1/√64 = 1/8.'],['100','3/2','1000',['150','10','300','1/1000'],'√100 = 10, then 10³ = 1000.'],['81','3/4','27',['60.75','3','9','1/27'],'Fourth root of 81 is 3, then 3³ = 27.'],['9','−1/2','1/3',['−3','3','−4.5','1/9'],'Flip, then square root: 1/√9 = 1/3.']];
  const [b,e,a,w,why]=pick(T);return mk(`Evaluate <b>${b}<sup>${e}</sup></b>`,a,w,why)}},
 {tip:'Scientific notation is a × 10ⁿ where 1 ≤ a < 10. Multiply the front numbers, add the powers of 10, then tidy up so the front number is between 1 and 10.',gen:()=>{const a=R(2,9),b=R(2,9),m=R(2,9),n=R(2,8),p=a*b;let c,e;if(p>=10){c=p/10;e=m+n+1}else{c=p;e=m+n}
  const S=(c,e)=>`${c} × 10${sup(e)}`;
  return mk(`Write <b>(${a} × 10${sup(m)}) × (${b} × 10${sup(n)})</b> in scientific notation.`,S(c,e),[S(p,m+n),S(c,m*n),S(a+b,m+n),S(c,e+1),S(c,e-1),S(a+b,e),S(c,e+2)],p>=10?`${a} × ${b} = ${p} and 10${sup(m)} × 10${sup(n)} = 10${sup(m+n)}. ${p} is not between 1 and 10, so write it as ${c} × 10¹, giving ${S(c,e)}.`:`${a} × ${b} = ${p}, then add the powers: ${m} + ${n} = ${m+n}.`)}}]},
{id:'money',name:'Applied Arithmetic',strand:'Number',blurb:'Percentages, VAT, compound interest and income tax.',levels:[
 {tip:'To find p% of an amount, divide by 100 and multiply by p. A p% reduction leaves (100 − p)%.',gen:()=>{const p=pick([5,10,15,20,25,30,35,40,60,75]),n=20*R(2,25),s=p*n/100;
  if(Math.random()<.5)return mk(`What is <b>${p}%</b> of <b>€${n}</b>?`,eur(s),[eur(p*n/10),eur(n-s),eur(s*2),eur(s+p),eur(n/p)],`${p}% = ${p}/100. ${p}/100 × ${n} = ${s}.`,'',FIG.pctBar(p,n,s,false));
  return mk(`A €${n} jacket is reduced by <b>${p}%</b> in the sale. What is the sale price?`,eur(n-s),[eur(s),eur(n-p),eur(n+s),eur(n-2*s),eur(n-s/2)],`${p}% of €${n} = €${s}. Sale price = ${n} − ${s} = €${n-s}.`,'',FIG.pctBar(p,n,s,true))}},
 {tip:'Adding VAT at 23% means × 1.23. Removing VAT means ÷ 1.23. Never take 23% off a price that already includes VAT.',gen:()=>{const X=pick([100,200,300,400,500,600,800,1000]),I=r2(X*1.23);

{id:'alg',name:'Algebra & Factorising',strand:'Algebra',blurb:'Expanding brackets, trinomials, difference of two squares.',levels:[
 {tip:'Multiply everything inside the bracket. A minus outside changes every sign inside. Then collect like terms.',gen:()=>{let p=R(2,5),q=pick([-4,-3,-2,2,3,4]);if(p+q===0)q=-q;const a=R(1,7)*pick([1,-1]),b=R(1,7)*pick([1,-1]),X=p+q,C=p*a+q*b,L=x=>poly(x,['x','']);

 {tip:'(x + a)(x + b): every term in the first bracket times every term in the second. Then combine the two x terms.',gen:()=>{let a,b;do{a=R(-7,7);b=R(-7,7)}while(!a||!b);

 {tip:'To factorise x² + bx + c, find two numbers that multiply to c and add to b. If c is positive the signs match; if c is negative they differ.',gen:()=>{let p,q;do{p=R(-8,8);q=R(-8,8)}while(!p||!q||p===q||p===-q);
  const key=(u,v)=>[u,v].sort((x,y)=>x-y).join(),K=key(p,q),c=[[-p,-q],[p,-q],[-p,q],[p*q,1],[p+q,1],[p,q+1]].filter(([u,v])=>v&&u&&key(u,v)!==K);

 {tip:'Always take out a common factor first. Difference of two squares: a² − b² = (a − b)(a + b). For 2x² + bx + c try (2x ± ?)(x ± ?) and check by expanding.',gen:()=>{
  if(Math.random()<.4){let a,b;do{a=R(2,5);b=R(1,9)}while(gcd(a,b)!==1);return mk(`Factorise <b>${a*a}x² − ${b*b}</b>`,`(${a}x − ${b})(${a}x + ${b})`,[`(${a}x − ${b})²`,`(${a*a}x − ${b})(x + ${b})`,`(${a}x + ${b})²`,`(${a}x − ${b*b})(${a}x + 1)`],`Difference of two squares: ${a*a}x² = (${a}x)² and ${b*b} = ${b}². So (${a}x − ${b})(${a}x + ${b}).`,'',FIG.area(a,-b,a,b))}

  const ex=(a1,b1,a2,b2)=>[a1*a2,a1*b2+b1*a2,b1*b2].join(),T=ex(a,p,1,q),f=(a1,b1,a2,b2)=>br(a1,b1)+br(a2,b2);
  return mk(`Factorise <b>${P2(a,a*q+p,p*q)}</b>`,f(a,p,1,q),[[a,q,1,p],[a,-p,1,-q],[a,p,1,-q],[a,-p,1,q]].filter(c=>ex(...c)!==T).map(c=>f(...c)),`Try (${a}x ± ?)(x ± ?). The numbers must multiply to ${M(p*q)} and the inner + outer terms must add to ${poly([a*q+p],['x'])}. Answer: ${f(a,p,1,q)}.`,'',FIG.area(a,p,1,q))}}]},
{id:'eq',name:'Equations',strand:'Algebra',blurb:'Linear, fractions, simultaneous and quadratic equations.',levels:[
 {tip:'Whatever you do to one side, do to the other. Get the x terms on one side and the numbers on the other.',gen:()=>{const x=R(-6,9),a=R(3,8),c=R(1,a-1),b=R(-10,10),d=(a-c)*x+b;

 {tip:'Fractions: multiply every term by the LCD. Put brackets around each top line so the minus signs behave.',gen:()=>{let m,n;do{m=R(2,5);n=R(2,5)}while(m===n);const x=R(1,12);let a,b;do{a=R(1,9)}while((x+a)%m);do{b=R(1,9)}while((x-b)%n);const k=(x+a)/m+(x-b)/n;

 {tip:'Simultaneous equations: make the coefficients of one letter match, add or subtract to get rid of it, solve, then substitute back to find the other.',gen:()=>{let x,y,a1,b1,a2,b2;do{x=R(-5,6);y=R(-5,6);a1=R(1,5);b1=R(1,5)*pick([1,-1]);a2=R(1,5);b2=R(1,5)*pick([1,-1])}while(!x||!y||x===y||a1*b2-a2*b1===0);
  const c1=a1*x+b1*y,c2=a2*x+b2*y,E=(a,b,c)=>`${poly([a,b],['x','y'])} = ${M(c)}`,S=(u,v)=>`x = ${M(u)}, y = ${M(v)}`;

 {tip:'Quadratic = 0: factorise, then set each bracket equal to 0. If it will not factorise, use the formula in the Formulae & Tables booklet.',gen:()=>{

   return mk(`Solve <b>${P2(1,-(p+q),p*q)} = 0</b>`,S(u,v),[S(-v,-u),S(u,-v),S(-u,v),S(u*v,1)],`Factorise: ${br(1,-p)}${br(1,-q)} = 0. Each bracket = 0, so x = ${M(p)} or x = ${M(q)}.`,'',FIG.parab(1,-(p+q),p*q,[u,v]))}

{id:'coord',name:'Coordinate Geometry',strand:'Geometry',blurb:'Midpoint, slope, distance, equation of a line.',levels:[

{id:'trig',name:'Trigonometry',strand:'Geometry',blurb:'Pythagoras, SOH CAH TOA, missing sides and angles.',levels:[

 {tip:'SOH CAH TOA. Label sides from the angle: opposite faces it, adjacent touches it, hypotenuse is the longest.',gen:()=>{const[o,a,h]=pick(TRIPLES),f=pick(['sin','cos','tan']),v={sin:`${o}/${h}`,cos:`${a}/${h}`,tan:`${o}/${a}`};

 {tip:'Finding a side: choose the ratio that links the side you have to the side you want. Check your calculator shows D (degrees mode).',gen:()=>{const th=pick([25,30,35,40,50,55,60,65,70]),h=R(5,20),rd=th*Math.PI/180,f1=v=>v.toFixed(1)+' m',t=R(0,2);

  const s=h*Math.tan(rd);return mk(`You stand <b>${h} m</b> from the base of a tree. The angle of elevation to the top is <b>${th}°</b>. How tall is the tree? (1 d.p.)`,f1(s),[f1(h*Math.sin(rd)),f1(h*Math.cos(rd)),f1(h/Math.tan(rd)),f1(h*Math.tan(th)),f1(s+1)],`tan ${th}° = O ÷ A, so O = ${h} × tan ${th}° = ${f1(s)}.`,FIG.rt({a:h+' m',o:'tree ?',ang:th+'°'}),'')}},
 {tip:'Finding an angle: work out the ratio as a fraction, then use sin⁻¹, cos⁻¹ or tan⁻¹ (usually SHIFT + sin/cos/tan).',gen:()=>{const D=x=>Math.round(x*180/Math.PI)+'°';

{id:'vol',name:'Area & Volume',strand:'Geometry',blurb:'Triangles, circles, cylinders, cones and spheres.',levels:[

 {tip:'Circle: area = πr², circumference = 2πr. Check whether you were given the radius or the diameter.',gen:()=>{const r=R(2,12),d=Math.random()<.5,g=d?`diameter <b>${2*r} cm</b>`:`radius <b>${r} cm</b>`,pre=d?`Radius = ${2*r} ÷ 2 = ${r}. `:'';

function lineEq(m,x1,y1,c,shown=99,rs=0,ls=0){return plane({xs:[x1,x1+1,0,x1-2,x1+2],ys:[y1,y1+m,c],

 segs:[{a:[x1,y1],b:[x1+1,y1],c:C.blue,arrow:1,step:rs,l:'1',lo:[0,m>0?16:-8]},{a:[x1+1,y1],b:[x1+1,y1+m],c:C.red,arrow:1,step:rs,l:M(m),lo:[8,4],anchor:'start'}],
 pts:[{x:x1,y:y1,l:PT(x1,y1),ld:[-9,-9],anchor:'end'},{x:0,y:c,l:PT(0,c),c:C.green,step:ls,ld:[9,14]}]},shown)}

// functions & equations
const lineFn=(a,b,k,v)=>plane({xs:[k,k-1,k+1,2,-2],ys:[v,b],curves:[{f:x=>a*x+b,c:C.blue,l:'y = '+poly([a,b],['x',''])}],segs:[{a:[k,0],b:[k,v],c:C.red,dash:1,w:2},{a:[k,v],b:[0,v],c:C.red,dash:1,w:2}],pts:[{x:k,y:v,l:PT(k,v),c:C.red,ld:[k>0?9:-9,v>0?-9:18],anchor:k>0?'start':'end'}]});
function parab(a,b,c,roots,pt,shown=99,rs=0){const f=x=>a*x*x+b*x+c,xv=-b/(2*a),yv=f(xv),xs=[xv-3.2,xv+3.2,...(roots||[]),...(pt?[pt[0]]:[])],ys=[yv,0,Math.min(Math.max(f(xv+3),4),Math.abs(yv)+8),...(pt?[pt[1]]:[])];
 return plane({xs,ys,curves:[{f,c:C.blue,l:'y = '+P2(a,b,c),lx:xv+2.6}],pts:[...(roots||[]).map((r,i)=>({x:r,y:0,l:'x = '+(Number.isInteger(r)?M(r):frac(r*2,2)),c:C.red,step:rs,ld:[i?8:-8,20],anchor:i?'start':'end'})),...(pt?[{x:pt[0],y:pt[1],l:PT(pt[0],pt[1]),c:C.red,ld:[9,-9]}]:[])]},shown)}
const meet=(a,b,c,d,x,shown=99,ps=0)=>{const y=a*x+b;return plane({xs:[x-3,x+3,0],ys:[y,b,d],curves:[{f:t=>a*t+b,c:C.blue,l:'y = '+poly([a,b],['x',''])},{f:t=>c*t+d,c:C.red,l:'y = '+poly([c,d],['x','']),lstart:1,dy:-10}],pts:[{x,y,l:`meet at x = ${M(x)}`,c:C.green,step:ps,ld:[10,18]}],segs:[{a:[x,0],b:[x,y],c:C.green,dash:1,w:2,step:ps}]},shown)};
const sim=(a1,b1,c1,a2,b2,c2,x,y,shown=99,ps=0)=>plane({xs:[x-4,x+4],ys:[y-4,y+4],curves:[{f:t=>(c1-a1*t)/b1,c:C.blue,l:poly([a1,b1],['x','y'])+' = '+M(c1)},{f:t=>(c2-a2*t)/b2,c:C.red,l:poly([a2,b2],['x','y'])+' = '+M(c2),lstart:1,dy:-10}],pts:[{x,y,l:PT(x,y),c:C.green,step:ps,ld:[10,18]}]},shown);

return {bar,plane,venn2,venn3,area,diffs,rt,triA,rectA,para,circ,cyl,cone,melt,dots,ordered,bag,dice,pctBar,vatBar,growth,taxBar,idx,mid,slope,perp,dist,lineEq,lineFn,parab,meet,sim};

  const n=document.createElement('div');n.className='node';
  n.innerHTML=`<button class="nbtn ${boss?'boss':''} ${done?'done':open?'open':''}" ${open?'':'disabled'} aria-label="${boss?'Boss round':'Level '+(i+1)}">${!open?ICON.lock:boss?ICON.crown:i+1}</button>
   <div class="nlabel"><b>${boss?'Boss round':LV[i]}</b><span>${boss?(done?'Trophy won':'6 mixed questions, 2 hearts'):starRow(S.stars[id+i]||0)}</span></div>`;
  if(open)n.querySelector('button').onclick=()=>startLevel(id,i);map.appendChild(n)}}

let G=null;
function startLevel(id,li){const t=TOPICS.find(x=>x.id===id),boss=li===4,n=boss?6:5;
 const qs=[];for(let k=0;k<n;k++){const lv=boss?t.levels[1+k%3]:t.levels[li];qs.push(lv.gen())}
 G={t,li,boss,qs,i:0,hearts:boss?2:3,max:boss?2:3,wrong:0,correct:0,revealed:0};
 const el=document.createElement('div');el.className='game';el.id='game';$('main').appendChild(el);
 renderIntro()}
function closeGame(){$('#game')?.remove();if(G)openTopic(G.t.id);G=null}
const heartsHTML=()=>`<div class="hearts" aria-label="${G.hearts} hearts left">${Array.from({length:G.max},(_,k)=>`<span class="${k<G.hearts?'':'lost'}">${ICON.heart}</span>`).join('')}</div>`;
function gHead(){return `<div class="gbar"><button class="x" aria-label="Quit">${ICON.x}</button><div class="bar"><i style="width:${G.i/G.qs.length*100}%"></i></div>${heartsHTML()}</div>`}
function renderIntro(){const el=$('#game'),tip=G.boss?'Mixed questions from the Building, Higher and Expert levels. You only get 2 hearts. Beat it and the trophy is yours.':G.t.levels[G.li].tip;
 el.innerHTML=`<div class="game-in">${gHead()}<div class="tipcard"><span class="who">Tutor's note</span><h2>${G.t.name}: ${G.boss?'Boss round':LV[G.li]}</h2><p>${tip}</p></div>
  ${G.boss?`<button class="btn pri" id="go">Start the boss round</button>`:`<button class="btn pri" id="go">Show me a worked example</button>`}</div>`;
 el.querySelector('.x').onclick=closeGame;const go=el.querySelector('#go');go.onclick=G.boss?renderQ:()=>renderExample(0);go.focus()}
function exHTML(e,shown,full){return `<div class="wex"><div class="lvl">Worked example</div><div class="qtext">${e.q}</div>${typeof e.fig==='function'?`<div class="wfig">${e.fig(shown)}</div>`:e.fig?tri(...e.fig):''}
 <ol class="wsteps">${e.steps.map((s,k)=>`<li ${k<shown?'':'hidden'}><span class="sn">${k+1}</span><span>${s}</span></li>`).join('')}</ol>
 ${full?`<div class="wans"><span class="who">Answer</span><b>${e.ans}</b></div>${e.trap?`<p class="wtrap"><b>Watch out:</b> ${e.trap}</p>`:''}`:''}</div>`}
function renderExample(shown){const el=$('#game'),e=EX[G.t.id][G.li],n=e.steps.length,full=shown>=n;
 el.innerHTML=`<div class="game-in">${gHead()}${exHTML(e,shown,full)}
  <div class="row">${full?`<button class="btn go" id="start">Start the quest</button><button class="btn" id="again">Replay example</button>`
   :`<button class="btn pri" id="step">${shown===0?'Show step 1':'Next step'}</button><button class="btn" id="all">Show all steps</button>`}</div></div>`;
 el.querySelector('.x').onclick=closeGame;
 if(full){el.querySelector('#start').onclick=renderQ;el.querySelector('#again').onclick=()=>renderExample(0);el.querySelector('#start').focus();el.querySelector('.wans').scrollIntoView({block:'nearest',behavior:'smooth'})}
 else{el.querySelector('#step').onclick=()=>renderExample(shown+1);el.querySelector('#all').onclick=()=>renderExample(n);el.querySelector('#step').focus();
  const last=el.querySelectorAll('.wsteps li:not([hidden])');if(last.length)last[last.length-1].scrollIntoView({block:'nearest',behavior:'smooth'})}}
function renderQ(){const el=$('#game'),q=G.qs[G.i];el.scrollTop=0;
 el.innerHTML=`<div class="game-in">${gHead()}<div class="qcard"><div class="lvl">${G.boss?'Boss':LV[G.li]} · Question ${G.i+1} of ${G.qs.length}</div><div class="qtext">${q.q}</div></div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-v="${esc(o)}"><span class="k">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div><button class="btn ghost" id="reveal">Show me the worked answer</button><div id="fbx"></div>${G.boss?'':`<details class="peek"><summary>Stuck? Look back at the worked example</summary>${exHTML(EX[G.t.id][G.li],99,true)}</details>`}</div>`;
 el.querySelector('.x').onclick=closeGame;
 el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));el.querySelector('#reveal').onclick=reveal}
function reveal(){const el=$('#game'),q=G.qs[G.i],last=G.i===G.qs.length-1;G.revealed++;
 el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===q.a)x.classList.add('right')});el.querySelector('#reveal').remove();
 const fb=el.querySelector('#fbx');fb.innerHTML=`<div class="fb help"><h3>Here's how it's done</h3><p class="note2">No heart lost, no points scored. This question counts as passed.</p>${q.vis?`<div class="figwrap">${q.vis}</div>`:''}${stepsHTML(whySteps(q.why))}<div class="wans"><span class="who">Answer</span><b>${q.a}</b></div><button class="btn pri" id="next">${last?'Finish':'Continue'}</button></div>`;
 const nx=fb.querySelector('#next');nx.focus({preventScroll:true});fb.scrollIntoView({block:'start',behavior:'smooth'});
 nx.onclick=()=>{if(last)return result(true);G.i++;renderQ()}}
function answer(b){const el=$('#game'),q=G.qs[G.i],ok=b.dataset.v===q.a;
 el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===q.a)x.classList.add('right')});
 if(!ok){b.classList.add('wrong');G.hearts--;G.wrong++}else G.correct++;el.querySelector('#reveal')?.remove();
 el.querySelector('.hearts').outerHTML=heartsHTML();
 const lose=G.hearts<=0,last=G.i===G.qs.length-1;
 const fb=el.querySelector('#fbx');fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><h3>${ok?pick(['Spot on!','Nailed it.','Correct!','Lovely work.','Exactly right.']):'Not quite.'}</h3><p>${q.why}</p>${q.vis?`<div class="figwrap">${q.vis}</div>`:''}<button class="btn ${ok?'go':''}" id="next">${lose?'See result':last?'Finish':'Continue'}</button></div>`;
 const nx=fb.querySelector('#next');nx.focus();fb.scrollIntoView({block:'nearest',behavior:'smooth'});
 nx.onclick=()=>{if(lose)return result(false);if(last)return result(true);G.i++;renderQ()}}
function result(pass){const el=$('#game'),id=G.t.id;let stars=0,xp=G.correct*10;
 if(pass){stars=G.boss?3:Math.max(1,3-G.wrong-G.revealed);xp+=G.correct?(G.boss?50:stars*5):0;
  if(G.boss)S.boss[id]=1;else S.stars[id+G.li]=Math.max(S.stars[id+G.li]||0,stars);confetti()}
 addXP(xp);
 const hasNext=pass&&G.li<4&&!(G.li===3&&![0,1,2,3].every(k=>S.stars[id+k]));
 el.innerHTML=`<div class="game-in"><div class="center">
  ${pass?(G.boss?`<div style="color:var(--marker);width:90px">${ICON.crown}</div><h1>Trophy won!</h1><p>You beat the ${G.t.name} boss round.</p>`:`${starRow(stars,'bigstars')}<h1>${stars===3?'Perfect level!':stars===2?'Level cleared!':'Scraped through!'}</h1><p>${G.correct} of ${G.qs.length} correct${G.revealed?`, ${G.revealed} shown with the worked answer`:''}.</p>`)
  :`<h1>Out of hearts</h1><p>${G.correct} correct before the hearts ran out. Read the tutor's note again and have another go. New numbers every time.</p>`}
  <span class="chip">+${xp} XP</span>
  <div class="row" style="justify-content:center">
   ${pass?(hasNext?`<button class="btn pri" id="nxt">${G.li===3?'Boss round':'Next level'}</button>`:''):`<button class="btn pri" id="retry">Try again</button>`}
   <button class="btn" id="map">Back to map</button></div></div></div>`;
 el.querySelector('#map').onclick=closeGame;
 const r=el.querySelector('#retry');if(r)r.onclick=()=>{const li=G.li;el.remove();startLevel(id,li)};
 const n=el.querySelector('#nxt');if(n)n.onclick=()=>{const li=G.li+1;el.remove();startLevel(id,li)};
 questRendered=false}

// ---------- Part 3: Test ----------
let sampleFn=null,imgCaps=null,T=null,files=[],ctl=null,timer=null;
const TOPIC_NAME=Object.fromEntries(TOPICS.map(t=>[t.id,t.name]));
const plain=h=>{const d=document.createElement('div');d.innerHTML=h.replace(/<sup>(.*?)<\/sup>/g,'^($1)').replace(/<span class="fr"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g,'($1)/($2)').replace(/<br>/g,'\n');return d.textContent};
function grade(p){return p>=90?'Distinction':p>=75?'Higher Merit':p>=55?'Merit':p>=40?'Achieved':p>=20?'Partially Achieved':'Not Graded'}
function renderTestHome(){const v=$('#v-test');clearInterval(timer);
 v.innerHTML=`<div class="sec-head"><div><h1>Test yourself</h1><p>A random exam-style paper drawn from every topic. Answer on paper with full working, take a photo, and get it marked like an exam script.</p></div></div>
 <div class="steps"><div class="step"><b class="n">1</b><span>Pick a paper. Questions are random each time.</span></div><div class="step"><b class="n">2</b><span>Write your answers on paper. Show every step.</span></div><div class="step"><b class="n">3</b><span>Photograph your pages and upload them.</span></div><div class="step"><b class="n">4</b><span>Get marks, red-pen feedback and what to fix.</span></div></div>
 <div class="tests" style="margin-top:16px">
  <button class="tchoice" data-n="3"><h3>Quick fire</h3><p>3 questions · about 20 minutes</p></button>
  <button class="tchoice" data-n="5"><h3>Mini paper</h3><p>5 questions · about 35 minutes</p></button>
  <button class="tchoice" data-n="8"><h3>Full paper</h3><p>8 questions · about 60 minutes</p></button></div>`;
 v.querySelectorAll('.tchoice').forEach(b=>b.onclick=()=>newTest(+b.dataset.n))}
function newTest(n){const byTopic={};shuffle(BANK).forEach(q=>{(byTopic[q.t]=byTopic[q.t]||[]).push(q)});
 const ts=shuffle(Object.keys(byTopic)),qs=[];let k=0;while(qs.length<n){const t=ts[k%ts.length],q=byTopic[t].shift();if(q)qs.push(q);k++;if(k>200)break}
 T={qs,start:Date.now(),done:false,res:null};files=[];renderPaper()}
function fmtT(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderPaper(){const v=$('#v-test'),tot=T.qs.reduce((s,q)=>s+q.m,0);v.scrollTop=0;
 v.innerHTML=`<div class="sec-head"><button class="back">${ICON.arrowL}New paper</button></div>
 <article class="paper"><h2>Higher Level Maths</h2><div class="pmeta"><span>Junior Cycle practice paper</span><span>${T.qs.length} questions</span><span>${tot} marks</span><span>Time: <span id="clock">00:00</span></span></div>
 ${T.qs.map((q,i)=>`<div class="pq"><span class="qn">Question ${i+1}</span><span class="mk">[${q.m} marks]</span><div class="body">${q.q}</div><div class="sol" hidden><b>Marking scheme:</b> ${esc(q.s)}</div></div>`).join('')}
 </article>
 <div class="upload" id="up"></div><div id="res"></div>`;
 v.querySelector('.back').onclick=renderTestHome;
 clearInterval(timer);if(!T.done)timer=setInterval(()=>{const c=$('#clock');if(c)c.textContent=fmtT(Date.now()-T.start)},1000);
 renderUpload()}
function renderUpload(){const up=$('#up');if(!up)return;const max=imgCaps?.maxCount||5;
 if(!sampleFn||!imgCaps){up.innerHTML=`<h3>Marking</h3><p class="warn">${sampleFn===undefined?'Checking whether photo marking is available…':'Photo marking by Claude is not available in this version. Mark your own work against the marking scheme, or ask a parent to upload your photos in the Claude app.'}</p><div class="row"><button class="btn" id="sols">Show marking scheme</button></div>`;
  up.querySelector('#sols').onclick=toggleSols;return}
 up.innerHTML=`<h3>Upload your answers</h3><p class="note">Number each answer. Write clearly in dark pen, photograph in good light, one page per photo. Up to ${max} photos.</p>
  <label class="btn go" for="pic">Add photos<input id="pic" type="file" accept="${(imgCaps.mediaTypes||['image/*']).join(',')}" multiple></label>
  <div class="thumbs"></div>
  <div class="row"><button class="btn pri" id="markBtn" ${files.length?'':'disabled'}>Mark my paper</button><button class="btn" id="sols">Show marking scheme</button></div><div id="mstat"></div>`;
 const th=up.querySelector('.thumbs');files.forEach((f,i)=>{const d=document.createElement('div');d.className='thumb';const u=URL.createObjectURL(f);d.innerHTML=`<img alt="Page ${i+1}" src="${u}"><button aria-label="Remove page ${i+1}">×</button>`;d.querySelector('button').onclick=()=>{files.splice(i,1);renderUpload()};th.appendChild(d)});
 up.querySelector('#pic').onchange=e=>{const add=[...e.target.files];const big=add.filter(f=>imgCaps.maxInputBytes&&f.size>imgCaps.maxInputBytes);files=[...files,...add.filter(f=>!big.includes(f))].slice(0,max);renderUpload();if(big.length)$('#mstat').innerHTML=`<p class="warn">${big.length} photo(s) were too large. Try a smaller photo.</p>`};
 up.querySelector('#markBtn').onclick=mark;up.querySelector('#sols').onclick=toggleSols}
function toggleSols(){const s=document.querySelectorAll('.sol');const show=s[0]?.hidden;s.forEach(x=>x.hidden=!show);this.textContent=show?'Hide marking scheme':'Show marking scheme'}
function buildPrompt(){const tot=T.qs.reduce((s,q)=>s+q.m,0);
 return `You are Ireland's best Junior Cycle Higher Level Mathematics tutor and an experienced State Examinations Commission examiner. A student (aged 14-15) has handwritten answers to the test below and photographed their pages. The attached images are those pages.

Mark the script the way an SEC examiner would:
- Use the marking scheme. Award marks for correct method even when the final answer is wrong; give partial credit for real progress.
- Accept any valid alternative method.
- Small deductions for missing units or wrong rounding when the question asks for it.
- A bare final answer with no work, where working is clearly needed, gets reduced credit.
- If a question is not attempted, or you cannot read it, award 0 and say so plainly.
- If the images are not maths work, award 0 for everything and explain in the summary.
Then teach: be warm, specific and encouraging. Point to the exact line where it went wrong. Use Irish/UK spelling. Plain text only, no LaTeX; write powers like x^2.

TEST (${T.qs.length} questions, ${tot} marks)
${T.qs.map((q,i)=>`Q${i+1} [${q.m} marks] (${TOPIC_NAME[q.t]})
${plain(q.q)}
Marking scheme: ${q.s}`).join('\n\n')}

Reply with only JSON in this shape:
{"questions":[{"n":1,"awarded":0,"max":${T.qs[0].m},"verdict":"correct|partial|incorrect|missing","seen":"one short line describing what the student wrote","feedback":"1-2 sentences of examiner feedback","fix":"one concrete next step"}],"total":0,"max":${tot},"summary":"2-3 encouraging sentences on the whole paper","focus":["topic to practise next"]}
Include every question from 1 to ${T.qs.length}.`}
async function mark(){const st=$('#mstat'),btn=$('#markBtn');btn.disabled=true;ctl=new AbortController();
 st.innerHTML=`<div class="marking" style="margin-top:8px">${ICON.pen}<span>Your examiner is marking…</span></div><button class="btn" id="stop" style="margin-top:8px">Stop</button>`;
 $('#stop').onclick=()=>ctl.abort();
 try{const r=await sampleFn.json(buildPrompt(),{images:files,signal:ctl.signal,cache:false});
  if(!r||!Array.isArray(r.questions))throw{code:'invalid_json'};
  const tot=T.qs.reduce((s,q)=>s+q.m,0);r.questions.forEach((q,i)=>{q.max=T.qs[i]?.m??q.max;q.awarded=Math.max(0,Math.min(Number(q.awarded)||0,q.max))});
  r.total=r.questions.reduce((s,q)=>s+q.awarded,0);r.max=tot;T.res=r;T.done=true;clearInterval(timer);st.innerHTML='';showResult();
  addXP(Math.round(r.total/tot*100));if(r.total/tot>=.75)confetti()}
 catch(e){const c=e?.code;btn.disabled=false;
  st.innerHTML=c==='cancelled'?'':`<p class="warn">${c==='not_granted'||c==='sampling_disabled'?'Marking was not allowed, so nothing was sent. Use the marking scheme to self-mark.':c==='rate_limited'?'Too many requests just now. Wait a minute and try again.':c==='image_rejected'?'One of the photos could not be read. Try a clearer JPEG or PNG.':c==='invalid_json'?'The marking came back in a muddle. Press Mark my paper to try again.':c==='refused'?'Those photos could not be marked. Check they show your maths work.':'Something went wrong while marking. Try again.'}</p>`}}
function showResult(){const r=T.res,box=$('#res');if(!box)return;const p=Math.round(r.total/r.max*100);
 box.innerHTML=`<section class="result"><div class="score"><div class="ring"><div><b>${r.total}</b><span>out of ${r.max}</span></div></div><div><div class="grade">${grade(p)}</div><p style="margin:4px 0 0;max-width:46ch">${esc(r.summary||'')}</p><p class="note">Time taken: ${fmtT(Date.now()-T.start)}</p></div></div>
 ${r.questions.map(q=>`<div class="qres"><span class="tick ${q.verdict==='correct'?'ok':''}">${q.verdict==='correct'?'✓':q.verdict==='partial'?'~':'✗'}</span><h4>Question ${esc(q.n)}</h4><span class="m">${q.awarded}/${q.max}</span>
  ${q.seen?`<span class="seen">You wrote: ${esc(q.seen)}</span>`:''}<span class="hand">${esc(q.feedback||'')}</span>${q.fix?`<span class="fix"><b>Fix:</b> ${esc(q.fix)}</span>`:''}</div>`).join('')}
 ${Array.isArray(r.focus)&&r.focus.length?`<div class="warn"><b>Practise next:</b> ${r.focus.map(esc).join(', ')}</div>`:''}
 <div class="row"><button class="btn pri" id="again">New paper</button><button class="btn" id="toq">Go to Quest</button></div></section>`;
 box.querySelector('#again').onclick=renderTestHome;box.querySelector('#toq').onclick=()=>setTab('quest');
 box.scrollIntoView({behavior:'smooth',block:'start'})}

// ---------- boot ----------
renderStats();renderFeed();renderTestHome();
sampleFn=undefined;
(async()=>{let s=null;try{if(window.claude&&claude.use)s=await claude.use('sample')}catch(e){}
 sampleFn=s;if(s){const lim=await s.limits().catch(()=>null);imgCaps=lim?.images||null}
 renderUpload()})();

</script>

</body>
