<body>
<title>JC French Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@400;600;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: phone-first app shell. The Quest is a métro map: each unit is a line, each lesson a station. Enamel-sign cream by day, night-métro navy by night. */
:root{
  --paper:#F6F2E8; --tile:rgba(15,26,61,.05); --ink:#0F1A3D; --muted:#5B6380; --stroke:#0F1A3D; --edge:#0F1A3D;
  --card:#FFFFFF; --soft:#ECE8F6; --navy:#1D2B6B; --on-navy:#FFFFFF;
  --go:#169A5A; --on-go:#FFFFFF; --stop:#D93448; --on-stop:#FFFFFF; --gold:#F2B705; --on-gold:#0F1A3D; --sky:#2F6FDB;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1430; --tile:rgba(255,255,255,.04); --ink:#EEF0F8; --muted:#9AA3C2; --stroke:#3A4685; --edge:#050816;
  --card:#18204A; --soft:#232C5C; --navy:#9DB0FF; --on-navy:#0E1430;
  --go:#38D184; --on-go:#06210F; --stop:#FF6B78; --on-stop:#2A0509; --gold:#F7C948; --on-gold:#0F1A3D; --sky:#7FA8FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1430; --tile:rgba(255,255,255,.04); --ink:#EEF0F8; --muted:#9AA3C2; --stroke:#3A4685; --edge:#050816;
  --card:#18204A; --soft:#232C5C; --navy:#9DB0FF; --on-navy:#0E1430;
  --go:#38D184; --on-go:#06210F; --stop:#FF6B78; --on-stop:#2A0509; --gold:#F7C948; --on-gold:#0F1A3D; --sky:#7FA8FF; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(45deg,var(--tile) 25%,transparent 25%,transparent 75%,var(--tile) 75%),linear-gradient(45deg,var(--tile) 25%,transparent 25%,transparent 75%,var(--tile) 75%);background-size:28px 28px;background-position:0 0,14px 14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:900;letter-spacing:-.01em;line-height:1.1;text-wrap:balance;margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:900;font-size:21px;white-space:nowrap}
.brand .plate{display:inline-grid;place-items:center;background:var(--navy);color:var(--on-navy);border-radius:8px;padding:2px 9px;font-size:18px;border:2px solid var(--gold)}
.stats{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--stroke);border-radius:999px;padding:3px 10px;font-weight:800;font-size:14px;background:var(--card);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--stroke);background:var(--card);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:4px 16px 28px}
nav.tabs{display:flex;justify-content:center;gap:6px;padding:8px 12px;border-top:2px solid var(--stroke);background:var(--card)}
nav.tabs button{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 4px;border-radius:12px;font-weight:800;font-size:13px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{background:var(--navy);color:var(--on-navy)}
.say{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2px solid var(--stroke);background:var(--sky);color:#fff;padding:0;flex:none;vertical-align:middle}
.say svg{width:18px;height:18px}
.say.big{width:84px;height:84px;border-width:3px;box-shadow:0 5px 0 var(--edge)}
.say.big svg{width:40px;height:40px}

/* ---------- Scroll ---------- */
#v-feed{padding:0;overflow:hidden}
.reels{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;padding:10px 16px}
.rc{position:relative;width:100%;max-width:460px;height:100%;border-radius:24px;border:2px solid var(--stroke);box-shadow:5px 5px 0 var(--edge);
  padding:56px 76px 28px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:hidden;background:var(--card)}
.rc::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--lc)}
.rc .tag{position:absolute;top:20px;left:22px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rc .count{position:absolute;top:20px;right:22px;font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.rc h2{font-size:clamp(28px,8vw,40px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rc .gloss{font-size:18px;font-weight:800;color:var(--muted);margin:-6px 0 0}
.rc p{margin:0;font-size:17px}
.rc .ex{font-size:18px;font-weight:700;border-left:5px solid var(--lc);background:var(--soft);border-radius:0 12px 12px 0;padding:10px 12px;display:flex;gap:10px;align-items:center}
.rc .check{border:2px solid var(--stroke);border-radius:14px;padding:10px 14px;background:transparent;text-align:left;font-weight:800;font-size:16px}
.rc .check .ans{display:block;font-family:var(--f-hand);font-size:28px;line-height:1.1;margin-top:4px;color:var(--go)}
.rc .tap{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.rail{position:absolute;right:12px;bottom:24px;display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{width:50px;height:50px;border-radius:50%;border:2px solid var(--stroke);background:var(--card);display:grid;place-items:center}
.rail button svg{width:24px;height:24px}
.rail small{display:block;text-align:center;font-size:11px;font-weight:800;margin-top:3px}
.rail button[aria-pressed="true"]{background:var(--stop);color:var(--on-stop);border-color:var(--stop)}
.hint{font-size:14px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.hint svg{width:18px;height:18px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* ---------- Quest (métro map) ---------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 14px}
.sec-head h1{font-size:clamp(28px,6vw,40px)}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:56ch}
.lines{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-bottom:20px}
.ubanner{display:flex;align-items:center;gap:12px;background:var(--lc);color:var(--lon);border:2px solid var(--stroke);border-radius:18px;box-shadow:4px 4px 0 var(--edge);padding:12px 14px}
.ubanner .num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--ink);border:3px solid var(--stroke);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:20px}
.ubanner .t{flex:1;min-width:0}
.ubanner .t small{display:block;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.ubanner .t b{display:block;font-family:var(--f-display);font-size:21px;line-height:1.1}
.ubanner .t span{font-size:14px;opacity:.9}
.ubanner button{flex:none;border:2px solid var(--stroke);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px}
.stations{position:relative;padding:6px 0 0 34px;display:flex;flex-direction:column;gap:14px}
.stations::before{content:"";position:absolute;left:52px;top:0;bottom:24px;width:10px;border-radius:5px;background:var(--lc);border:2px solid var(--stroke)}
.st{position:relative;display:flex;align-items:center;gap:14px}

["Greetings","Bonjour ou salut ?","Hello or hi?","Bonjour is polite: teachers, adults, shops. Salut is for friends.","Bonjour, madame !","How do you greet your teacher?","Bonjour, madame / monsieur.",0,["Your teacher is an adult you should be polite to.","Polite = bonjour, plus madame or monsieur.","Salut would be too casual."]],
["Tu or vous","Tu ou vous ?","Two words for 'you'","Tu: a friend, a family member, a child. Vous: an adult you don't know, or more than one person.","Vous désirez, monsieur ?","Talking to a shop assistant: tu or vous?","Vous",4,["A shop assistant is an adult you don't know.","Strangers and adults get the polite vous."]],
["Age","J'ai quatorze ans","I am fourteen","French uses avoir (to have) for age, not être.","Ma sœur a dix ans.","Say 'I am fifteen'.","J'ai quinze ans.",0,["Age uses avoir: j'ai.","15 = quinze.","Add ans (years): J'ai quinze ans."]],
["Gender","Le ou la ?","Masculine or feminine","Words ending in -tion are feminine. Words ending in -age are usually masculine.","la natation, le fromage","Le or la natation?","la natation",3,["natation ends in -tion.","-tion words are feminine, so: la natation."]],
["Opinions","J'aime… parce que…","I like… because…","Give an opinion and a reason in every answer. Examiners love parce que.","J'aime le dessin parce que c'est créatif.","Say 'I like maths because it's easy'.","J'aime les maths parce que c'est facile.",2,["I like = j'aime. Maths = les maths.","because = parce que. It's easy = c'est facile.","J'aime les maths parce que c'est facile."]],
["Negatives","ne … pas","not","Wrap ne … pas around the verb. ne becomes n' before a vowel.","Je ne joue pas au golf.","Say 'I don't play rugby'.","Je ne joue pas au rugby.",2,["I play rugby = je joue au rugby.","Wrap ne … pas around joue.","Je ne joue pas au rugby."]],
["To the…","au, à la, à l', aux","to the","à + le → au. à + les → aux. à la and à l' never change.","Je vais au parc. Je vais aux magasins.","Say 'to the beach' (la plage).","à la plage",5,["plage is feminine: la plage.","à + la stays as à la.","à la plage."]],
["Some","du, de la, des","some / any","Use them for food and drink, even where English leaves 'some' out.","Je mange du pain et des fruits.","Say 'some bread' (le pain).","du pain",4,["pain is masculine: le pain.","de + le → du.","du pain."]],
["Negatives","pas de","not any","After a negative, du / de la / des all become de (d' before a vowel).","Je n'ai pas de frères.","Say 'I don't have any brothers'.","Je n'ai pas de frères.",0,["I have brothers = j'ai des frères.","Make it negative: je n'ai pas…","des becomes de: Je n'ai pas de frères."]],
["Hobbies","jouer à / jouer de","play a sport / play an instrument","Sport: jouer à (au foot). Instrument: jouer de (de la guitare).","Je joue au tennis et je joue du piano.","Say 'I play the guitar' (la guitare).","Je joue de la guitare.",3,["Guitar is an instrument, so use jouer de.","la guitare is feminine: de la guitare.","Je joue de la guitare."]],
["Hobbies","faire de…","to do / go …","Many activities use faire: faire du vélo, de la natation, du ski.","Je fais du ski en hiver.","Say 'I go swimming'.","Je fais de la natation.",3,["Swimming = la natation (feminine).","Activities use faire de: de la natation.","Je fais de la natation."]],
["Routine","Je me lève","I get up","Reflexive verbs need the extra me / te / se.","Je me lève, je me douche, je m'habille.","Say 'I go to bed' (se coucher).","Je me couche.",6,["The verb is se coucher.","With je, se becomes me.","Je me couche."]],
["Time","Il est huit heures et demie","It's half past eight","et quart = quarter past, et demie = half past, moins le quart = quarter to.","Il est neuf heures moins le quart. (8:45)","How do you say 8:30?","huit heures et demie",6,["8 o'clock = huit heures.","Half past = et demie.","huit heures et demie."]],
["Days","le lundi","on Mondays","Days and months have no capital letter in French. le lundi = every Monday.","Le samedi, je joue au foot.","Say 'on Saturdays'.","le samedi",3,["Saturday = samedi (no capital).","Adding le makes it 'every Saturday': le samedi."]],
["Dates","le premier mai","the first of May","For the 1st use premier. Every other date is a plain number: le deux mai, le dix mai.","Mon anniversaire est le vingt juin.","Say '1 May'.","le premier mai",0,["The 1st is special: premier.","Months have no capital: mai.","le premier mai."]],
["Numbers","soixante-dix","seventy","70 = soixante-dix (60 + 10). 80 = quatre-vingts (4 × 20). 90 = quatre-vingt-dix (4 × 20 + 10).","75 = soixante-quinze","What is 75?","soixante-quinze",null,["75 = 60 + 15.","60 = soixante, 15 = quinze.","soixante-quinze."]],
["Past tense","J'ai joué","I played","avoir + past participle. -er verbs: drop -er, add -é.","J'ai regardé un film.","Say 'I played'.","J'ai joué.",7,["Present of avoir with je: j'ai.","jouer → joué.","J'ai joué."]],
["Past tense","Je suis allé","I went","Movement verbs use être: aller, venir, arriver, partir, rester, entrer, sortir, tomber.","Je suis arrivé à six heures.","Say 'I went' (aller).","Je suis allé(e).",7,["aller is a movement verb, so it uses être.","Je suis + allé.","Add -e if you are a girl: je suis allée."]],
["Past tense","Elle est allée","She went","With être, the past participle agrees like an adjective: add -e for feminine, -s for plural.","Ils sont partis. Elles sont arrivées.","Say 'she arrived' (arriver).","Elle est arrivée.",7,["arriver uses être: elle est arrivé…","She is feminine, so add -e.","Elle est arrivée."]],
["Future","Je vais manger","I am going to eat","Futur proche = aller (present) + infinitive.","Ce soir, je vais regarder la télé.","Say 'I am going to eat'.","Je vais manger.",9,["I am going = je vais.","Add the infinitive: manger.","Je vais manger."]],
["Adjectives","une robe noire","a black dress","Adjectives agree: add -e for feminine, -s for plural, -es for feminine plural.","des chaussures noires","Say 'a black dress' (la robe).","une robe noire",8,["robe is feminine: une robe.","Colours go after the noun.","Feminine, so add -e: une robe noire."]],
["Adjectives","une petite maison","a small house","A few adjectives go before the noun: grand, petit, beau, jeune, bon, nouveau.","un grand jardin","Say 'a small house'.","une petite maison",1,["petit is one of the adjectives that go before the noun.","maison is feminine, so petit → petite.","une petite maison."]],
["Weather","Il fait froid","It's cold","Most weather uses il fait. Rain and snow have their own verbs: il pleut, il neige.","Il fait beau et chaud.","Say 'It's cold'.","Il fait froid.",9,["Temperature weather uses il fait.","cold = froid.","Il fait froid."]],
["False friends","la librairie","the bookshop","A librairie sells books. The library is la bibliothèque.","Je vais à la librairie acheter un livre.","Where do you borrow books?","la bibliothèque",5,["Borrowing books happens in a library.","Library = la bibliothèque, not la librairie."]],
["False friends","Il est sensible","He is sensitive","sensible means sensitive. 'Sensible' in English is raisonnable.","Ma sœur est très sensible.","What does 'Il est sensible' mean?","He is sensitive.",null,["sensible is a false friend.","It means sensitive, not sensible."]],
["Questions","Où ? Quand ? Comment ?","Where? When? How?","Also: pourquoi (why), combien (how much / many), qui (who), qu'est-ce que (what).","Où habites-tu ?","How do you ask 'Where do you live?'","Où habites-tu ?",null,["Where = où.","Swap the verb and pronoun to ask a question: habites-tu.","Où habites-tu ?"]],

let VOICE=null;const canSpeak=()=>'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;

function say(t,rate=.88){if(!canSpeak())return false;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';if(VOICE)u.voice=VOICE;u.rate=rate;speechSynthesis.speak(u);return true}catch(e){return false}}

 if(l===0)return [exMeaning(v[0],U),exMeaning(v[1],U),exListenWord(v[2],U),exReverse(v[3],U),exMatch(v.slice(4,9)),exReverse(v[9],U),exListenWord(v[10],U),exMeaning(v[11],U)];
 if(l===1)return [exTrans(s[0],U),exBuild(s[1],U),exListenSent(s[2],U),exBuild(s[3],U),exTrans(s[4],U),exBuild(s[5],U),exListenSent(s[6],U)];
 if(l===2)return [exGap(g[0]),exGap(g[1]),exBuild(s[0],U),exGap(g[2]),exGap(g[3]),exBuild(s[1],U),exGap(g[4]),exGap(g[5])];
 return shuffle([exMeaning(v[0],U),exReverse(v[1],U),exMatch(v.slice(2,7)),exBuild(s[0],U),exBuild(s[1],U),exGap(g[0]),exGap(g[1]),exListenSent(s[2],U)])}

// ---------- lesson flow ----------
let G=null;
function startLesson(u,l){const ex=buildLesson(u,l);G={u,l,U:UNITS[u],ex,i:0,max:l===3?2:3,hearts:l===3?2:3,wrong:0,correct:0,revealed:0,sel:null};
 $('#game')?.remove();const el=document.createElement('div');el.className='game';el.id='game';el.style.cssText=`--lc:${G.U.c}`;$('main').appendChild(el);renderLearn()}
const heartsHTML=()=>`<div class="hearts" aria-label="${G.hearts} hearts left">${Array.from({length:G.max},(_,k)=>`<span class="${k<G.hearts?'':'lost'}">${ICON.heart}</span>`).join('')}</div>`;
const gtop=()=>`<div class="g-top"><button class="x" aria-label="Quit">${ICON.x}</button><div class="bar"><i style="width:${G.i/G.ex.length*100}%"></i></div>${heartsHTML()}</div>`;
function frame(body,foot){const el=$('#game');el.innerHTML=`${gtop()}<div class="g-body"><div class="g-in">${body}</div></div><div class="g-foot" id="foot"><div class="in">${foot}</div></div>`;el.querySelector('.x').onclick=quit;return el}
function quit(){speechSynthesis?.cancel?.();$('#game')?.remove();G=null;renderQuest()}
function renderLearn(){const U=G.U,l=G.l;let body=`<div class="learn"><span class="who">Avant de commencer…</span><h2>Ligne ${G.u+1} · ${LESSONS[l].fr}</h2>`;
 if(l===0)body+=`<p>Tap a speaker to hear each word. Read them through, then start.</p><div class="vlist">${U.vocab.map(v=>`<div class="vrow">${sayBtn(v[0])}<b>${esc(v[0])}</b><span>${esc(v[1])}</span></div>`).join('')}</div>`;
 if(l===1)body+=`<p>Listen to these sentences. Notice the word order: it is often close to English.</p><div class="vlist">${U.sent.slice(0,6).map(s=>`<div class="vrow">${sayBtn(s[0])}<b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('')}</div>`;
 if(l===2){const g=U.gaps[0],full=g[0].replace('___',g[1]);body+=`<p style="font-size:17px;line-height:1.6">${U.tip}</p><h3 style="font-size:19px">Worked example</h3><div class="gapline">${esc(g[0]).replace('___','<span class="blank">?</span>')}</div>${stepsHTML(['Look at what comes before and after the gap.',esc(g[3]),`So the answer is <b>${esc(g[1])}</b>.`])}<div class="wans"><span class="who">Answer</span><b>${esc(full)} ${sayBtn(full.replace(/\s*\(.*\)/,''))}</b></div>`}
 if(l===3)body+=`<p>The terminus: a mixed review of the whole unit. Only <b>2 hearts</b>. Finish it to win the line's trophy.</p><p style="font-size:16px;line-height:1.6">${U.tip}</p>`;
 body+='</div>';
 const el=frame(body,`<button class="btn go wide" id="startL">Start lesson</button>`);el.querySelector('#startL').onclick=renderEx;el.querySelector('#startL').focus()}
function renderEx(){const e=G.ex[G.i];G.sel=null;let body=`<span class="kind">${e.kind}</span>`;
 if(e.type==='mcq'){if(e.gap)body+=`<div class="gapline">${esc(e.gap).replace('___','<span class="blank">?</span>')}</div>`;else body+=`<div class="prompt">${e.prompt}</div>`;
  if(e.big)body+=`<div style="display:flex;justify-content:center;gap:16px;align-items:center">${sayBtn(e.big,true)}<button class="link" data-slow>Slower</button></div>`;
  body+=`<div class="opts">${e.opts.map((o,k)=>`<button class="opt" data-v="${esc(o)}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`}
 if(e.type==='build')body+=`<div class="prompt">${e.prompt}</div><div class="answerline" id="aline"></div><div class="bank">${e.tiles.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t)}</button>`).join('')}</div>`;
 if(e.type==='match'){const R=shuffle(e.pairs);body+=`<div class="prompt">Tap the matching pairs</div><div class="pairs">${e.pairs.map((p,k)=>`<button class="pair" data-side="fr" data-id="${esc(p[0])}">${esc(p[0])}</button><button class="pair" data-side="en" data-id="${esc(R[k][0])}">${esc(R[k][1])}</button>`).join('')}</div>`}
 const foot=e.type==='match'?`<div class="row"><button class="link" id="reveal">Show me the answer</button></div>`:`<div class="row"><button class="link" id="reveal">Show me the answer</button><button class="btn pri" id="check" disabled>Check</button></div>`;
 const el=frame(body,foot);el.querySelector('#reveal').onclick=reveal;
 if(e.auto)setTimeout(()=>say(e.auto),250);
 const slow=el.querySelector('[data-slow]');if(slow)slow.onclick=()=>say(e.big,.6);
 if(e.type==='mcq'){el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');G.sel=b.dataset.v;$('#check').disabled=false});$('#check').onclick=()=>check(G.sel===e.a)}
 if(e.type==='build'){const line=el.querySelector('#aline'),chosen=[];
  el.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{if(t.classList.contains('used'))return;t.classList.add('used');const c=document.createElement('button');c.className='tile';c.textContent=t.textContent;chosen.push(t.textContent);
   c.onclick=()=>{const i=[...line.children].indexOf(c);chosen.splice(i,1);c.remove();t.classList.remove('used');$('#check').disabled=!chosen.length};line.appendChild(c);$('#check').disabled=false});
  $('#check').onclick=()=>check(chosen.join(' ')===e.words.join(' '))}
 if(e.type==='match'){let pick1=null,left=e.pairs.length;
  el.querySelectorAll('.pair').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;if(b.dataset.side==='fr')say(b.textContent);
   if(!pick1||pick1.dataset.side===b.dataset.side){pick1?.classList.remove('sel');pick1=b;b.classList.add('sel');return}
   if(pick1.dataset.id===b.dataset.id){[pick1,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});sfx(true);left--;pick1=null;if(!left){G.correct++;feedback(true,e)}}
   else{const a=pick1;[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('bad')});sfx(false);setTimeout(()=>[a,b].forEach(x=>x.classList.remove('bad')),400);pick1=null}})}}
function check(ok){const e=G.ex[G.i];if(ok)G.correct++;else{G.hearts--;G.wrong++}
 const el=$('#game');if(e.type==='mcq')el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===e.a)x.classList.add('right');else if(x.classList.contains('sel'))x.classList.add('wrong')});
 if(e.type==='build')el.querySelectorAll('.tile').forEach(t=>t.disabled=true);
 el.querySelector('.hearts').outerHTML=heartsHTML();feedback(ok,e)}
function feedback(ok,e,help){sfx(ok||help?true:false);if(e.sayAfter&&(ok||help))setTimeout(()=>say(e.sayAfter),200);
 const lose=G.hearts<=0,last=G.i===G.ex.length-1,foot=$('#foot');foot.className='g-foot '+(help?'help':ok?'ok':'no');
 const head=help?'Here is the answer':ok?pick(['Bravo !','Excellent !','Parfait !','Super !','Très bien !']):'Pas tout à fait…';
 const sub=help?'<p style="font-size:14px">No heart lost, no points. This one counts as passed.</p>':'';
 const ansLine=e.type==='match'?'':`<p>${ok&&!help?'':'Correct answer: '}<b>${esc(e.gap?e.ans:e.a)}</b></p>`;
 foot.innerHTML=`<div class="in"><h3>${head}</h3>${sub}${ansLine}<p>${e.why||'All pairs matched.'}</p><button class="btn wide" id="next">${lose?'See result':last?'Finish':'Continue'}</button></div>`;
 const nx=foot.querySelector('#next');nx.focus({preventScroll:true});nx.onclick=()=>{if(lose)return result(false);if(last)return result(true);G.i++;renderEx()}}
function reveal(){const e=G.ex[G.i],el=$('#game');G.revealed++;
 if(e.type==='mcq')el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===e.a)x.classList.add('right')});
 if(e.type==='build'){el.querySelectorAll('.tile').forEach(t=>t.disabled=true);el.querySelector('#aline').innerHTML=e.words.map(w=>`<span class="tile">${esc(w)}</span>`).join('')}
 if(e.type==='match'){const by={};el.querySelectorAll('.pair').forEach(b=>{b.disabled=true;b.classList.add('ok')});e.why=e.pairs.map(p=>`<b>${esc(p[0])}</b> = ${esc(p[1])}`).join('<br>')}
 feedback(false,e,true)}
function result(pass){const el=$('#game'),k=key(G.u,G.l);let stars=0,xp=G.correct*10;
 if(pass){stars=Math.max(1,3-G.wrong-G.revealed);if(G.correct)xp+=stars*5+(G.l===3?30:0);S.done[k]=Math.max(S.done[k]||0,stars);confetti()}
 addXP(xp);const next=pass&&G.l<3;
 el.innerHTML=`<div class="g-body"><div class="g-in"><div class="center">
  ${pass?(G.l===3?`<div style="color:var(--gold);width:96px">${ICON.trophy}</div><h1>Terminus !</h1><p>You finished Ligne ${G.u+1}: ${G.U.fr}.</p>`:`${starRow(stars,'bigstars')}<h1>${stars===3?'Parfait !':stars===2?'Bien joué !':'Ouf, c\'est bon !'}</h1>`)
   :`<h1>Plus de cœurs…</h1><p>Out of hearts. Look at the tips and try again: the questions change every time.</p>`}
  <p>${G.correct} of ${G.ex.length} correct${G.revealed?`, ${G.revealed} shown`:''}.</p><span class="chip">+${xp} XP</span>
  <div class="row" style="justify-content:center">${pass?(next?`<button class="btn pri" id="nxt">Next station</button>`:''):`<button class="btn pri" id="retry">Try again</button>`}<button class="btn" id="map">Back to the map</button></div></div></div></div>`;
 const {u,l}=G;el.querySelector('#map').onclick=quit;
 el.querySelector('#retry')?.addEventListener('click',()=>startLesson(u,l));el.querySelector('#nxt')?.addEventListener('click',()=>startLesson(u,l+1))}

function listenTest(){const P=pick(LISTEN),v=$('#v-test');v.scrollTop=0;let plays=0;

TASK: ${T.task}
